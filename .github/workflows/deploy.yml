name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        php: [8.3]
    env:
      DEPLOY_MACHINE: myvm
      PHP_EXTENSIONS: json, dom, curl, libxml, mbstring, gd
      ARCHIVE_ASSETS: assets.tar.xz
      ARCHIVE_VENDOR: vendor.tar.xz

    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Archive composer deps
        run: tar -cJf ${{ env.ARCHIVE_VENDOR }} vendor

      - name: Install NPM dependencies
        run: npm ci --include=dev

      - name: Build assets
        run: npm run build

      - name: Archive assets
        run: tar -cJf ${{ env.ARCHIVE_ASSETS }} public/build

      - name: Copy files
        run: rsync
          -a "$ARCHIVE_VENDOR" "$ARCHIVE_ASSETS"
          "${{ secrets.MACHINE_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.MACHINE_WORKDIR }}"

      - name: Deploy
        run: |
          ssh "${{ secrets.MACHINE_USER }}@${{ secrets.SSH_HOST }}" /bin/bash << EOF
            cd "${{ secrets.MACHINE_WORKDIR }}"
            git pull
            ./scripts/deploy.sh "$ARCHIVE_VENDOR" "$ARCHIVE_ASSETS"
          EOF
